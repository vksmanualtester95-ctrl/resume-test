# Resume Layout Style - Machine-readable source for all builds
# Derived from the working resume.html that scored 95/100 on check.py
# This file must be read by all resume build pipelines

header:
  unchanged: true
  # Contact block preserved exactly from current working HTML
  # Name, role, location, phone, email, LinkedIn, GitHub

sections:
  heading_top_gap_px: 8      # Clear visual gap before every section heading
  heading_bottom_gap_px: 0   # Explicit zero - content starts immediately after heading
  common_top_gap_px: 8       # All section headings use this (Summary, Skills, Experience, Projects, Certifications, Education)

# --- GAP MODEL (required symmetric layout) ---
# User requirement: every section and every role/project block must show a
# TOP gap and ZERO bottom gap (so it never looks "gap-free on top but gapped
# on bottom"). Implemented as: heading margin-bottom 0, body gets explicit
# top margin, ALL <p> margins reset to 0 so no default <p> bottom margin leaks.
section_body_gap_px: 3       # top gap for Summary <p> / Skills <p> / entry bodies
p_margin_reset: true         # zero ALL <p> margins; gaps come from explicit top only

role_block:
  top_gap_px: 4              # margin-top on EVERY role block (incl. first under heading)
  bottom_gap_px: 0           # margin-bottom 0 -> no trailing gap after a role
  note: "Top-gap model. legacy inter_item_gap_px(3) superseded; do not use margin-bottom."

project_block:
  top_gap_px: 4              # margin-top on EVERY project block (incl. first under heading)
  bottom_gap_px: 0           # margin-bottom 0 -> no trailing gap after a project
  note: "Top-gap model. legacy inter_item_gap_px(3) superseded; do not use margin-bottom."

project_link:
  style: italic_selectable_clickable  # Italic, selectable, clickable in PDF

page:
  size: A4
  margin_mm: {top: 10, right: 12, bottom: 10, left: 12}
  columns: 1
  header_footer: false
  background_graphics: false
  scale_pct: 100

fonts:
  family: "Arial, Helvetica Neue, Helvetica, sans-serif"
  variant_ligatures: none
  base_size_pt: 8.8
  print_size_pt: 9.3
  line_height: 1.17
  color: "#000"

heading:
  h1_size_pt: 17
  h1_weight: 700
  h1_letter_spacing_px: 0.3
  h2_size_pt: 10
  h2_weight: 700
  h2_letter_spacing_px: 0.6
  h2_text_transform: uppercase
  h2_background: "#ececec"
  h2_border_radius_px: 4
  h2_padding: "2px 8px"
  h2_print_color_adjust: exact

export:
  engine: chrome_headless
  chrome_path_macos: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
  pdf_headers_footers: false
  no_manual_dialog: true
